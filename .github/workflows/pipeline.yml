name: Build model

# Downloads the newest published HMDA years, retrains the models, reruns the fair-lending audit and republishes the
# site. HMDA is released once a year (with occasional revisions), so a monthly run is plenty.
on:
  schedule:
    - cron: "23 10 5 * *" # 10:23 UTC on the 5th of every month
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # commit README results and MODEL_CARD.md
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test before touching real data
        run: pytest -q

      - name: Download HMDA, prepare, train, audit, build site
        run: python -m mortgage.pipeline
        env:
          PYTHONPATH: src

      - name: Commit README results and model card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md MODEL_CARD.md
          if ! git diff --staged --quiet; then
            git commit -m "Update results: HMDA $(python -c 'import json;y=json.load(open("site/results.json"))["years"];print(y["train"][0], "-", y["test"])')"
            git pull --rebase -X theirs  # our freshly generated results win any README conflict
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
